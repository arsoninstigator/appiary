ext {
  capacitorPluginVersion = project.hasProperty('capacitorPluginVersion') ? capacitorPluginVersion : 'unspecified'
}

apply plugin: 'com.android.library'

android {
  namespace 'appiary.game.services'
  compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext['compileSdkVersion'] : 36
  defaultConfig {
    minSdkVersion rootProject.ext.has('minSdkVersion') ? rootProject.ext['minSdkVersion'] : 24
    targetSdkVersion rootProject.ext.has('targetSdkVersion') ? rootProject.ext['targetSdkVersion'] : 36
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }
}

repositories {
  google()
}

// shared androidx versions follow capacitor's own module pattern
// (rootProject.ext lookup with a fallback); v2 sign-in surfaces
// FragmentActivity types, so appcompat must be on the compile classpath.
def androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
dependencies {
  implementation "androidx.appcompat:appcompat:${androidxAppCompatVersion}"
  implementation "com.google.android.gms:play-services-games-v2:22.1.0"
  implementation project(':capacitor-android')
}
